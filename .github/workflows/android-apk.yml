name: Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          TOOLS="$(ls -d "$SDK"/cmdline-tools/* | tail -1)"
          yes | "$TOOLS/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$TOOLS/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" 2>&1 | tail -5

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: primeshim-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
